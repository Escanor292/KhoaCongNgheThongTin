{% extends "base.html" %}
{% block title %}Đăng nhập — QL Đồ án{% endblock %}
{% block body %}
<div class="login-card">
  <h1>Đăng nhập hệ thống</h1>
  <p class="sub">Tài khoản demo — mật khẩu <b>123456</b></p>
  <form method="post">
    <label>Tên đăng nhập / MSSV</label>
    <input name="ten_dang_nhap" value="2112345" required />

    <input name="mat_khau" type="password" value="123456" required />

  <div class="hint">
    <div><b>SV:</b> 2112345 Nguyễn Văn An · 2112346 Trần Thị Bình · 2112347 Lê Minh Cường</div>
    <div><b>GV:</b> gv001 TS. Trần Minh Đức</div>
  </div>
</div>
{% endblock %}
